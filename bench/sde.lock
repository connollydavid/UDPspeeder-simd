# Intel Software Development Emulator, pinned.
#
# AVX-512BW is the one path with no way to run it. QEMU's TCG emulates no
# AVX-512 at any CPU model, and it leaves ZMM state disabled in XCR0, so our
# OS-support check correctly declines and the tier is skipped rather than
# tested. GitHub's runners do not carry it either. SDE presents a full CPU
# model, XCR0 included, so the guard chain sees AVX-512 as available and the
# tier is compared against its reference like every other.
#
# Proved by the negative control: a faulted avx512 multiply fails four tests
# under SDE, and the same binary passes everything natively, because the path
# is skipped. Without this lane a broken AVX-512 path is invisible.
#
# Licence: Intel Simplified Software License, October 2022, verbatim beside
# this file in SDE-LICENSE.txt and also inside the tarball under Licenses/.
# It permits use and redistribution in binary form without modification, so
# long as the notices travel with it. The tarball is redistributed byte for
# byte and carries its own; nothing here is repacked or altered.
#
# The tarball is not fetchable unattended from Intel: the download requires a
# person to accept the licence. So it is obtained once by hand and mirrored,
# and every later fetch is the one pinned, hash-verified download.

