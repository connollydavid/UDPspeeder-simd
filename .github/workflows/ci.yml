name: CI

on:
  push:
    branches: [branch_libev, master]
  pull_request:
    branches: [branch_libev, master]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run correctness tests
        run: make test

      - name: Build benchmarks
        run: make bench

      - name: Run benchmarks
        run: ./bench_udpspeeder

      - name: Run benchmarks (JSON)
        run: taskset -c 0 ./bench_udpspeeder --json

      - name: Build production binary
        run: make all

      - name: Throughput test (io_uring)
        run: bash bench/throughput.sh ./speederv2 --iterations 3 --duration 5

      - name: Throughput test (recvfrom baseline)
        run: UDPSPEEDER_NO_URING=1 bash bench/throughput.sh ./speederv2 --iterations 3 --duration 5

      - name: Store benchmark results
        if: github.ref == 'refs/heads/branch_libev'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: UDPspeeder Benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '115%'
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: dev/bench

  build-static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: x86_64
            packages: ""
            toolchain_url: ""
            bench_target: bench-static
            test_target: test-static
            prod_target: all
            make_args: ""
            bench_bin: bench_udpspeeder_static
            test_bin: test_udpspeeder_static
            prod_bin: speederv2
            qemu_cmd: ""
          - name: aarch64
            packages: g++-aarch64-linux-gnu qemu-user-static
            toolchain_url: ""
            bench_target: bench-cross
            test_target: test-cross
            prod_target: all-cross
            make_args: "CC=aarch64-linux-gnu-g++"
            bench_bin: bench_udpspeeder_cross
            test_bin: test_udpspeeder_cross
            prod_bin: speederv2_cross
            qemu_cmd: qemu-aarch64-static
          - name: mips
            packages: g++-mips-linux-gnu qemu-user-static
            toolchain_url: ""
            bench_target: bench-cross
            test_target: test-cross
            prod_target: all-cross
            make_args: "CC=mips-linux-gnu-g++"
            bench_bin: bench_udpspeeder_cross
            test_bin: test_udpspeeder_cross
            prod_bin: speederv2_cross
            qemu_cmd: qemu-mips-static
          - name: powerpc
            packages: qemu-user-static zstd
            toolchain_url: "https://downloads.openwrt.org/releases/25.12.0-rc5/targets/mpc85xx/p1010/openwrt-toolchain-25.12.0-rc5-mpc85xx-p1010_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
            bench_target: bench-cross
            test_target: test-cross
            prod_target: all-cross
            make_args: "SPE=1"
            bench_bin: bench_udpspeeder_cross
            test_bin: test_udpspeeder_cross
            prod_bin: speederv2_cross
            qemu_cmd: "qemu-ppc-static -cpu e500v2"
          - name: riscv64
            packages: qemu-user-static zstd
            toolchain_url: "https://downloads.openwrt.org/releases/24.10.0/targets/sifiveu/generic/openwrt-toolchain-24.10.0-sifiveu-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            bench_target: bench-cross
            test_target: test-cross
            prod_target: all-cross
            make_args: ""
            bench_bin: bench_udpspeeder_cross
            test_bin: test_udpspeeder_cross
            prod_bin: speederv2_cross
            qemu_cmd: qemu-riscv64-static
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Download OpenWrt toolchain
        if: matrix.toolchain_url != ''
        run: |
          curl -fSL "${{ matrix.toolchain_url }}" -o toolchain.tar.zst
          mkdir -p /tmp/openwrt-toolchain
          tar --zstd -xf toolchain.tar.zst -C /tmp/openwrt-toolchain --strip-components=1
          OPENWRT_GXX=$(find /tmp/openwrt-toolchain -name '*-g++' -path '*/bin/*' | head -1)
          echo "OPENWRT_GXX=${OPENWRT_GXX}" >> "$GITHUB_ENV"
          echo "STAGING_DIR=/tmp/openwrt-toolchain" >> "$GITHUB_ENV"
          echo "Found toolchain: ${OPENWRT_GXX}"

      - name: Build bench (${{ matrix.name }})
        run: |
          ARGS="${{ matrix.make_args }}"
          if [ -n "${OPENWRT_GXX:-}" ]; then
            ARGS="CC=${OPENWRT_GXX} ${ARGS}"
          fi
          make ${{ matrix.bench_target }} ${ARGS}

      - name: Build test (${{ matrix.name }})
        run: |
          ARGS="${{ matrix.make_args }}"
          if [ -n "${OPENWRT_GXX:-}" ]; then
            ARGS="CC=${OPENWRT_GXX} ${ARGS}"
          fi
          make ${{ matrix.test_target }} ${ARGS}

      - name: Build production (${{ matrix.name }})
        run: |
          ARGS="${{ matrix.make_args }}"
          if [ -n "${OPENWRT_GXX:-}" ]; then
            ARGS="CC=${OPENWRT_GXX} ${ARGS}"
          fi
          make ${{ matrix.prod_target }} ${ARGS}

      - name: Verify binaries
        run: file ${{ matrix.bench_bin }} ${{ matrix.test_bin }} ${{ matrix.prod_bin }}

      - name: Run tests (QEMU)
        if: matrix.qemu_cmd != ''
        run: ${{ matrix.qemu_cmd }} ./${{ matrix.test_bin }}

      - name: Run benchmarks (QEMU)
        if: matrix.qemu_cmd != ''
        run: ${{ matrix.qemu_cmd }} ./${{ matrix.bench_bin }}

      - name: Run benchmarks JSON (QEMU)
        if: matrix.qemu_cmd != '' && matrix.name == 'powerpc'
        run: ${{ matrix.qemu_cmd }} ./${{ matrix.bench_bin }} --json

      - name: Store PPC benchmark results
        if: matrix.name == 'powerpc' && github.ref == 'refs/heads/branch_libev'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: UDPspeeder Benchmarks (PowerPC e500v2 via QEMU)
          tool: customSmallerIsBetter
          output-file-path: bench_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: dev/bench-powerpc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: udpspeeder-${{ matrix.name }}
          path: |
            ${{ matrix.bench_bin }}
            ${{ matrix.test_bin }}
            ${{ matrix.prod_bin }}
            bench/profile.sh

  # Every job above runs on whatever CPU the runner happens to be, which has each
  # feature a dispatcher looks for, so it always takes the top path. What broke in
  # practice was the choice rather than the paths: an SSSE3 multiply selected on a
  # CPU without SSSE3. So build the three x86 targets OpenWrt ships and run the
  # test binary under CPU models that lack each feature in turn, naming the path
  # the multiply, the XOR and the checksum must each yield. The AVX2 rows need
  # QEMU 7.2 or newer; no model reaches AVX-512, because TCG does not implement
  # it, and Skylake-Server is there to prove the gate declines rather than
  # trusting the model name.
  cpu-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user-static zstd
          qemu-x86_64-static --version | head -1

      - name: Download OpenWrt x86 toolchains
        run: |
          set -e
          rel=25.12.0-rc5
          base="https://downloads.openwrt.org/releases/$rel/targets/x86"
          for entry in geode:x86-geode generic:x86-generic 64:x86-64; do
            sub=${entry%%:*}
            name=${entry##*:}
            mkdir -p "/tmp/tc/$name"
            curl -fSL "$base/$sub/openwrt-toolchain-$rel-${name}_gcc-14.3.0_musl.Linux-x86_64.tar.zst" \
              | tar --zstd -x -C "/tmp/tc/$name" --strip-components=1
          done

      - name: Build one test and one tunnel binary per x86 target
        run: |
          set -e
          # The toolchains default to -march=i486, so name the architecture
          # OpenWrt builds each target for.
          build() {
            gxx=$(find "/tmp/tc/$1" -name '*-g++' -path '*/bin/*' | sort | head -1)
            make test-cross CC="$gxx -march=$2"
            mv test_udpspeeder_cross "test.$3"
            make all-cross CC="$gxx -march=$2"
            mv speederv2_cross "speederv2.$3"
            file "test.$3" "speederv2.$3"
          }
          build x86-geode   pentium-mmx pentium-mmx
          build x86-generic pentium4    pentium4
          build x86-64      x86-64      x86_64

      - name: Hold dispatch to each CPU model
        run: |
          set -u
          pass=0
          fail=0
          run() {
            log="run.$1.$(echo "$3" | tr -c 'A-Za-z0-9' '_').log"
            if EXPECT_ADDMUL1="$4" EXPECT_XOR_TILE="$5" EXPECT_CRC32C="$6" \
               "$2" -cpu "$3" "./test.$1" > "$log" 2>&1; then
              pass=$((pass + 1))
              printf 'ok    %-12s %-17s %s / %s / %s\n' "$1" "$3" "$4" "$5" "$6"
            else
              fail=$((fail + 1))
              printf 'FAIL  %-12s %-17s wanted %s / %s / %s\n' "$1" "$3" "$4" "$5" "$6"
              grep -E 'dispatches to|FAIL:' "$log" || true
            fi
          }

          run pentium-mmx qemu-i386-static   486                scalar word sw
          run pentium-mmx qemu-i386-static   pentium,+mmx       scalar mmx  sw
          run pentium-mmx qemu-i386-static   pentium3,+sse2     sse2   sse2 sw
          run pentium4    qemu-i386-static   pentium3,+sse2     sse2   sse2 sw
          run pentium4    qemu-i386-static   n270               ssse3  sse2 sw
          run pentium4    qemu-i386-static   Haswell            ssse3  avx2 hw
          run x86_64      qemu-x86_64-static Opteron_G1,-sse3   sse2   sse2 sw
          run x86_64      qemu-x86_64-static Nehalem            ssse3  sse2 hw
          run x86_64      qemu-x86_64-static Haswell            avx2   avx2 hw
          run x86_64      qemu-x86_64-static Skylake-Server     avx2   avx2 hw

          echo "$pass passed, $fail failed"
          [ "$fail" -eq 0 ]

  interop:
    runs-on: ubuntu-latest
    needs: [build-static]
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: udpspeeder-x86_64
          path: bin/x86_64

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: udpspeeder-aarch64
          path: bin/aarch64

      - name: Download mips artifact
        uses: actions/download-artifact@v4
        with:
          name: udpspeeder-mips
          path: bin/mips

      - name: Download powerpc artifact
        uses: actions/download-artifact@v4
        with:
          name: udpspeeder-powerpc
          path: bin/powerpc

      - name: Download riscv64 artifact
        uses: actions/download-artifact@v4
        with:
          name: udpspeeder-riscv64
          path: bin/riscv64

      - name: Set executable permissions
        run: chmod +x bin/*/speederv2 bin/*/speederv2_cross

      - name: Run cross-architecture interop tests
        run: |
          set -e
          PASS=0
          FAIL=0

          X86="bin/x86_64/speederv2"
          ARM="qemu-aarch64-static bin/aarch64/speederv2_cross"
          MIPS="qemu-mips-static bin/mips/speederv2_cross"
          PPC="qemu-ppc-static -cpu e500v2 bin/powerpc/speederv2_cross"
          RV64="qemu-riscv64-static bin/riscv64/speederv2_cross"

          TESTS=(
            "x86-server_arm-client|$X86|$ARM"
            "arm-server_x86-client|$ARM|$X86"
            "x86-server_mips-client|$X86|$MIPS"
            "mips-server_x86-client|$MIPS|$X86"
            "x86-server_ppc-client|$X86|$PPC"
            "ppc-server_x86-client|$PPC|$X86"
            "x86-server_rv64-client|$X86|$RV64"
            "rv64-server_x86-client|$RV64|$X86"
          )

          CONFIGS=(
            "--disable-fec|no-fec"
            "--disable-fec --key testkey123|no-fec-key"
            "--fec 20:10|fec-20-10"
            "--fec 20:10 --key testkey123|fec-20-10-key"
          )

          for entry in "${TESTS[@]}"; do
            IFS='|' read -r pair_name server_cmd client_cmd <<< "$entry"
            for cfg in "${CONFIGS[@]}"; do
              IFS='|' read -r cfg_args cfg_label <<< "$cfg"
              label="${pair_name}/${cfg_label}"

              echo ""
              echo "=========================================="
              echo "  TESTING: $label"
              echo "=========================================="

              if bash bench/interop.sh \
                --server-cmd "$server_cmd" \
                --client-cmd "$client_cmd" \
                $cfg_args \
                --label "$label" \
                --packets 200; then
                PASS=$((PASS + 1))
              else
                FAIL=$((FAIL + 1))
                echo "^^^ FAILED: $label ^^^"
              fi
            done
          done

          echo ""
          echo "=========================================="
          echo "  INTEROP RESULTS: $PASS passed, $FAIL failed"
          echo "=========================================="

          if [[ $FAIL -ne 0 ]]; then
            exit 1
          fi
