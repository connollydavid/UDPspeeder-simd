name: CI

on:
  push:
    branches: [branch_libev, master]
  pull_request:
    branches: [branch_libev, master]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run correctness tests
        run: make test

      # The same suite under AddressSanitizer and UndefinedBehaviorSanitizer.
      # Nearly everything this fork added is what these two catch: lane-width
      # arithmetic in the vector kernels, the tails that finish a loop a few
      # bytes at a time, and the direct-mapped tables that replaced std::map in
      # the FEC decode. Leak detection is on, and the harness frees exactly what
      # it allocated, so anything left is the library's.
      - name: Run correctness tests (ASan, UBSan)
        run: make test-sanitize

      # de_cook is what a packet from the network touches first, and it trims a
      # length the sender chose before anything is authenticated. One crash has
      # already come from exactly there (a4d32c3, an IV length used without
      # being range-checked). Removing that check again makes this lane fail,
      # which is why it is here rather than as a green line nobody has tested.
      - name: Fuzz the packet decoder (bounded random)
        run: make fuzz

      - name: Fuzz the packet decoder (libFuzzer)
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          make fuzz-libfuzzer FUZZ_SECONDS=120

      - name: Keep any reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers
          path: fuzz-artifacts/
          if-no-files-found: ignore

      - name: Build benchmarks
        run: make bench

      - name: Run benchmarks
        run: ./bench_udpspeeder

      - name: Run benchmarks (JSON)
        run: taskset -c 0 ./bench_udpspeeder --json

      - name: Build production binary
        run: make all

      # AVX-512BW runs nowhere else. QEMU emulates none of it and leaves ZMM
      # state out of XCR0, so the gate correctly declines and the tier is
      # skipped; a GitHub runner carries the instructions only by luck of which
      # host it lands on. SDE presents a full CPU model, so the tier is compared
      # against its reference like any other. The copy is hash-pinned in
      # bench/sde.lock and the wrapper refuses anything that does not match.
      - name: Run correctness tests (Intel SDE, AVX-512BW)
        env:
          EXPECT_DISPATCH_HELD: 1
          EXPECT_ADDMUL1: avx512bw
          EXPECT_XOR_TILE: avx512bw
          EXPECT_CRC32C: hw
        run: bash bench/with-sde.sh skx ./test_udpspeeder

      # Read the emitted code, which the running tests cannot do. An instruction
      # the CPU cannot decode faults whether or not the dispatcher meant to reach
      # it, and that is exactly how the SSSE3 crash worked. The selftest runs
      # first and builds a binary breaking every rule the screen holds: a screen
      # that reports clean because its patterns match nothing looks identical to
      # a clean binary, which is how the first version of this passed a file
      # stuffed with violations.
      - name: Screen the emitted x86 code
        run: |
          bash bench/isa-screen-selftest.sh
          bash bench/isa-screen.sh speederv2

      - name: Throughput test (io_uring)
        run: bash bench/throughput.sh ./speederv2 --iterations 3 --duration 5

      - name: Throughput test (recvfrom baseline)
        run: UDPSPEEDER_NO_URING=1 bash bench/throughput.sh ./speederv2 --iterations 3 --duration 5

      - name: Store benchmark results
        if: github.ref == 'refs/heads/branch_libev'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: UDPspeeder Benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '115%'
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: dev/bench

  build-static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: x86_64
            packages: ""
            toolchain_url: ""
            bench_target: bench-static
            test_target: test-static
            prod_target: all
            make_args: ""
            bench_bin: bench_udpspeeder_static
            test_bin: test_udpspeeder_static
            prod_bin: speederv2
            qemu_cmd: ""
            cpu_flags: ""
            expect_addmul1: any
            expect_xor: any
            expect_crc32c: any
          - name: aarch64
            packages: g++-aarch64-linux-gnu qemu-user-static
            toolchain_url: ""
            bench_target: bench-cross
            test_target: test-cross
            prod_target: all-cross
            make_args: "CC=aarch64-linux-gnu-g++"
            bench_bin: bench_udpspeeder_cross
            test_bin: test_udpspeeder_cross
            prod_bin: speederv2_cross
            qemu_cmd: qemu-aarch64-static
            cpu_flags: ""
            expect_addmul1: neon
            expect_xor: neon
            expect_crc32c: sw
          - name: mips
            packages: g++-mips-linux-gnu qemu-user-static
            toolchain_url: ""
            bench_target: bench-cross
            test_target: test-cross
            prod_target: all-cross
            make_args: "CC=mips-linux-gnu-g++"
            bench_bin: bench_udpspeeder_cross
            test_bin: test_udpspeeder_cross
            prod_bin: speederv2_cross
            qemu_cmd: qemu-mips-static
            cpu_flags: ""
            expect_addmul1: scalar
            expect_xor: word
            expect_crc32c: sw
          - name: powerpc
            packages: qemu-user-static zstd
            toolchain_url: "https://downloads.openwrt.org/releases/25.12.0-rc5/targets/mpc85xx/p1010/openwrt-toolchain-25.12.0-rc5-mpc85xx-p1010_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
            bench_target: bench-cross
            test_target: test-cross
            prod_target: all-cross
            make_args: ""
            bench_bin: bench_udpspeeder_cross
            test_bin: test_udpspeeder_cross
            prod_bin: speederv2_cross
            qemu_cmd: "qemu-ppc-static -cpu e500v2"
            cpu_flags: "-mcpu=8548"
            expect_addmul1: scalar
            expect_xor: spe
            expect_crc32c: sw
          # Three of OpenWrt's fourteen 32-bit ARM architectures name NEON, and
          # the same core is published both with and without it, so something has
          # to decide. It is not a flag: OpenWrt defines no CPU_CFLAGS for arm and
          # passes no -mfpu anywhere in its tree. It configures a per-target
          # toolchain instead, and the compiler default carries the FPU, which is
          # why these two rows pass no cpu_flags. Adding any would test our flag
          # rather than the feed's toolchain. Verified: the a15 toolchain defines
          # __ARM_NEON with an empty command line and the a9 toolchain does not.
          - name: armv7-neon
            packages: qemu-user-static zstd
            toolchain_url: "https://downloads.openwrt.org/releases/25.12.0-rc5/targets/armsr/armv7/openwrt-toolchain-25.12.0-rc5-armsr-armv7_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst"
            bench_target: bench-cross
            test_target: test-cross
            prod_target: all-cross
            make_args: ""
            bench_bin: bench_udpspeeder_cross
            test_bin: test_udpspeeder_cross
            prod_bin: speederv2_cross
            qemu_cmd: "qemu-arm-static -cpu cortex-a15"
            cpu_flags: ""
            expect_addmul1: neon
            expect_xor: neon
            expect_crc32c: sw
          - name: armv7-scalar
            packages: qemu-user-static zstd
            toolchain_url: "https://downloads.openwrt.org/releases/25.12.0-rc5/targets/mvebu/cortexa9/openwrt-toolchain-25.12.0-rc5-mvebu-cortexa9_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst"
            bench_target: bench-cross
            test_target: test-cross
            prod_target: all-cross
            make_args: ""
            bench_bin: bench_udpspeeder_cross
            test_bin: test_udpspeeder_cross
            prod_bin: speederv2_cross
            qemu_cmd: "qemu-arm-static -cpu cortex-a9"
            cpu_flags: ""
            expect_addmul1: scalar
            expect_xor: word
            expect_crc32c: sw
          - name: riscv64
            packages: qemu-user-static zstd
            toolchain_url: "https://downloads.openwrt.org/releases/24.10.0/targets/sifiveu/generic/openwrt-toolchain-24.10.0-sifiveu-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            bench_target: bench-cross
            test_target: test-cross
            prod_target: all-cross
            make_args: ""
            bench_bin: bench_udpspeeder_cross
            test_bin: test_udpspeeder_cross
            prod_bin: speederv2_cross
            qemu_cmd: qemu-riscv64-static
            cpu_flags: ""
            expect_addmul1: scalar
            expect_xor: word
            expect_crc32c: sw
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      # OpenWrt names a core for its aarch64 targets, so GCC defines
      # __ARM_FEATURE_CRC32 and the hardware checksum is compiled in on every
      # one of them bar the generic build. The plain cross compiler used below
      # names no core, so that path is absent and its agreement test quietly
      # skips. Build for a core that carries it, and require the comparison to
      # have run: a skip must not read as a pass. The binary is rebuilt without
      # the core by the steps that follow, so the artifact is unaffected.
      - name: Take the checksum a named core carries (${{ matrix.name }})
        if: matrix.name == 'aarch64'
        run: |
          set -o pipefail
          make test-cross CC="aarch64-linux-gnu-g++ -mcpu=cortex-a53"
          EXPECT_DISPATCH_HELD=1 \
          EXPECT_CRC32C=hw EXPECT_XOR_TILE=neon EXPECT_ADDMUL1=neon \
            qemu-aarch64-static -cpu cortex-a53 ./test_udpspeeder_cross | tee a53.log
          n=$(grep -c 'crc32c hw==sw' a53.log || true)
          if [ "$n" -eq 0 ]; then
            echo "FAIL  the hardware checksum never ran, only the software one"
            exit 1
          fi
          echo "ok    hardware and software checksums compared over $n cases"
          rm -f a53.log

      # An unverified download builds the binaries we ship from whatever the
      # network returned. The hash lives in bench/arch-map.tsv beside the URL,
      # one place, and a mismatch stops the job rather than being carried past.
      - name: Download OpenWrt toolchain
        if: matrix.toolchain_url != ''
        run: |
          want=$(awk -F'\t' -v n='${{ matrix.name }}' \
                   '!/^#/ && $1 == n { print $3 }' bench/arch-map.tsv)
          if [ -z "$want" ] || [ "$want" = "-" ]; then
            echo "FAIL  bench/arch-map.tsv records no sha256 for ${{ matrix.name }}"
            exit 1
          fi
          curl -fSL "${{ matrix.toolchain_url }}" -o toolchain.tar.zst
          got=$(sha256sum toolchain.tar.zst | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "FAIL  toolchain sha256 mismatch for ${{ matrix.name }}"
            echo "      expected $want"
            echo "      got      $got"
            exit 1
          fi
          echo "ok    toolchain matches the pin in bench/arch-map.tsv"
          mkdir -p /tmp/openwrt-toolchain
          tar --zstd -xf toolchain.tar.zst -C /tmp/openwrt-toolchain --strip-components=1
          OPENWRT_GXX=$(find /tmp/openwrt-toolchain -name '*-g++' -path '*/bin/*' | head -1)
          echo "OPENWRT_GXX=${OPENWRT_GXX}" >> "$GITHUB_ENV"
          echo "STAGING_DIR=/tmp/openwrt-toolchain" >> "$GITHUB_ENV"
          echo "Found toolchain: ${OPENWRT_GXX}"

      - name: Build bench (${{ matrix.name }})
        run: |
          if [ -n "${OPENWRT_GXX:-}" ]; then
            make ${{ matrix.bench_target }} \
              CC="${OPENWRT_GXX} ${{ matrix.cpu_flags }}" ${{ matrix.make_args }}
          else
            make ${{ matrix.bench_target }} ${{ matrix.make_args }}
          fi

      - name: Build test (${{ matrix.name }})
        run: |
          if [ -n "${OPENWRT_GXX:-}" ]; then
            make ${{ matrix.test_target }} \
              CC="${OPENWRT_GXX} ${{ matrix.cpu_flags }}" ${{ matrix.make_args }}
          else
            make ${{ matrix.test_target }} ${{ matrix.make_args }}
          fi

      - name: Build production (${{ matrix.name }})
        run: |
          if [ -n "${OPENWRT_GXX:-}" ]; then
            make ${{ matrix.prod_target }} \
              CC="${OPENWRT_GXX} ${{ matrix.cpu_flags }}" ${{ matrix.make_args }}
          else
            make ${{ matrix.prod_target }} ${{ matrix.make_args }}
          fi

      - name: Verify binaries
        run: file ${{ matrix.bench_bin }} ${{ matrix.test_bin }} ${{ matrix.prod_bin }}

      # The job above now builds the way the feed does, with -mcpu=8548 and no
      # SPE=1, so its green already depends on the makefile reading the flag.
      # What it cannot show is the other half: that a PowerPC core without SPE
      # stays clear of these opcodes. Without that, a detection matching every
      # target would pass too. So require the opcodes for an e500 and require
      # their absence for a core that has none.
      - name: Take the SPE flag from the target (${{ matrix.name }})
        if: matrix.name == 'powerpc'
        run: |
          objdump=$(find /tmp/openwrt-toolchain -name '*-objdump' -path '*/bin/*' | sort | head -1)
          rc=0
          check() { # cpu wanted
            # NAME keeps this off speederv2_cross, which the artifact step wants
            make cross_cxx NAME=spe_probe CXX="${OPENWRT_GXX}" \
              CXXFLAGS="-Os -mcpu=$1" > /dev/null
            n=$("$objdump" -d spe_probe_cross | grep -cE '\bev(ldd|stdd|xor)\b' || true)
            if [ "$2" = yes ] && [ "$n" -eq 0 ]; then
              echo "FAIL  -mcpu=$1 built no SPE opcodes"
              rc=1
            elif [ "$2" = no ] && [ "$n" -ne 0 ]; then
              echo "FAIL  -mcpu=$1 built $n SPE opcodes"
              rc=1
            else
              echo "ok    -mcpu=$1 built $n SPE opcodes"
            fi
          }
          check 8548 yes
          check 464fp no
          rm -f spe_probe_cross
          exit $rc

      # A compile-time selection is still a selection, so name every path this
      # build must have chosen. EXPECT_DISPATCH_HELD makes a missing expectation
      # a failure rather than a silent skip, so a variable renamed here and not
      # in the test cannot quietly stop checking. Only x86_64 declines all three,
      # with "any": its dispatch follows whatever chip the runner has, and the
      # cpu-dispatch job below pins that down against named CPU models instead.
      - name: Run tests (QEMU)
        if: matrix.qemu_cmd != ''
        env:
          EXPECT_DISPATCH_HELD: 1
          EXPECT_ADDMUL1: ${{ matrix.expect_addmul1 }}
          EXPECT_XOR_TILE: ${{ matrix.expect_xor }}
          EXPECT_CRC32C: ${{ matrix.expect_crc32c }}
        run: ${{ matrix.qemu_cmd }} ./${{ matrix.test_bin }}

      - name: Run benchmarks (QEMU)
        if: matrix.qemu_cmd != ''
        run: ${{ matrix.qemu_cmd }} ./${{ matrix.bench_bin }}

      - name: Run benchmarks JSON (QEMU)
        if: matrix.qemu_cmd != '' && matrix.name == 'powerpc'
        run: ${{ matrix.qemu_cmd }} ./${{ matrix.bench_bin }} --json

      - name: Store PPC benchmark results
        if: matrix.name == 'powerpc' && github.ref == 'refs/heads/branch_libev'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: UDPspeeder Benchmarks (PowerPC e500v2 via QEMU)
          tool: customSmallerIsBetter
          output-file-path: bench_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          benchmark-data-dir-path: dev/bench-powerpc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: udpspeeder-${{ matrix.name }}
          path: |
            ${{ matrix.bench_bin }}
            ${{ matrix.test_bin }}
            ${{ matrix.prod_bin }}
            bench/profile.sh

  # Every job above runs on whatever CPU the runner happens to be, which has each
  # feature a dispatcher looks for, so it always takes the top path. What broke in
  # practice was the choice rather than the paths: an SSSE3 multiply selected on a
  # CPU without SSSE3. So build the three x86 targets OpenWrt ships and run the
  # test binary under CPU models that lack each feature in turn, naming the path
  # the multiply, the XOR and the checksum must each yield. The AVX2 rows need
  # QEMU 7.2 or newer; no model reaches AVX-512, because TCG does not implement
  # it, and Skylake-Server is there to prove the gate declines rather than
  # trusting the model name.
  cpu-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-user-static zstd
          qemu-x86_64-static --version | head -1

      - name: Download OpenWrt x86 toolchains
        run: |
          set -e
          rel=25.12.0-rc5
          base="https://downloads.openwrt.org/releases/$rel/targets/x86"
          for entry in geode:x86-geode generic:x86-generic 64:x86-64; do
            sub=${entry%%:*}
            name=${entry##*:}
            mkdir -p "/tmp/tc/$name"
            curl -fSL "$base/$sub/openwrt-toolchain-$rel-${name}_gcc-14.3.0_musl.Linux-x86_64.tar.zst" \
              | tar --zstd -x -C "/tmp/tc/$name" --strip-components=1
          done

      - name: Build one test and one tunnel binary per x86 target
        run: |
          set -e
          # The toolchains default to -march=i486, so name the architecture
          # OpenWrt builds each target for.
          build() {
            gxx=$(find "/tmp/tc/$1" -name '*-g++' -path '*/bin/*' | sort | head -1)
            make test-cross CC="$gxx -march=$2"
            mv test_udpspeeder_cross "test.$3"
            make all-cross CC="$gxx -march=$2"
            mv speederv2_cross "speederv2.$3"
            file "test.$3" "speederv2.$3"
          }
          build x86-geode   pentium-mmx pentium-mmx
          build x86-generic pentium4    pentium4
          build x86-64      x86-64      x86_64

      - name: Hold dispatch to each CPU model
        run: |
          set -u
          pass=0
          fail=0
          run() {
            log="run.$1.$(echo "$3" | tr -c 'A-Za-z0-9' '_').log"
            if EXPECT_DISPATCH_HELD=1 \
               EXPECT_ADDMUL1="$4" EXPECT_XOR_TILE="$5" EXPECT_CRC32C="$6" \
               "$2" -cpu "$3" "./test.$1" > "$log" 2>&1; then
              pass=$((pass + 1))
              printf 'ok    %-12s %-17s %s / %s / %s\n' "$1" "$3" "$4" "$5" "$6"
            else
              fail=$((fail + 1))
              printf 'FAIL  %-12s %-17s wanted %s / %s / %s\n' "$1" "$3" "$4" "$5" "$6"
              grep -E 'dispatches to|FAIL:' "$log" || true
            fi
          }

          run pentium-mmx qemu-i386-static   486                scalar word sw
          run pentium-mmx qemu-i386-static   pentium,+mmx       scalar mmx  sw
          run pentium-mmx qemu-i386-static   pentium3,+sse2     sse2   sse2 sw
          run pentium4    qemu-i386-static   pentium3,+sse2     sse2   sse2 sw
          run pentium4    qemu-i386-static   n270               ssse3  sse2 sw
          run pentium4    qemu-i386-static   Haswell            ssse3  avx2 hw
          run x86_64      qemu-x86_64-static Opteron_G1,-sse3   sse2   sse2 sw
          run x86_64      qemu-x86_64-static Nehalem            ssse3  sse2 hw
          run x86_64      qemu-x86_64-static Haswell            avx2   avx2 hw
          run x86_64      qemu-x86_64-static Skylake-Server     avx2   avx2 hw

          echo "$pass passed, $fail failed"
          [ "$fail" -eq 0 ]

  interop:
    runs-on: ubuntu-latest
    needs: [build-static]
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: udpspeeder-x86_64
          path: bin/x86_64

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: udpspeeder-aarch64
          path: bin/aarch64

      - name: Download mips artifact
        uses: actions/download-artifact@v4
        with:
          name: udpspeeder-mips
          path: bin/mips

      - name: Download powerpc artifact
        uses: actions/download-artifact@v4
        with:
          name: udpspeeder-powerpc
          path: bin/powerpc

      - name: Download riscv64 artifact
        uses: actions/download-artifact@v4
        with:
          name: udpspeeder-riscv64
          path: bin/riscv64

      - name: Set executable permissions
        run: chmod +x bin/*/speederv2 bin/*/speederv2_cross

      - name: Run cross-architecture interop tests
        run: |
          set -e
          PASS=0
          FAIL=0

          X86="bin/x86_64/speederv2"
          ARM="qemu-aarch64-static bin/aarch64/speederv2_cross"
          MIPS="qemu-mips-static bin/mips/speederv2_cross"
          PPC="qemu-ppc-static -cpu e500v2 bin/powerpc/speederv2_cross"
          RV64="qemu-riscv64-static bin/riscv64/speederv2_cross"

          TESTS=(
            "x86-server_arm-client|$X86|$ARM"
            "arm-server_x86-client|$ARM|$X86"
            "x86-server_mips-client|$X86|$MIPS"
            "mips-server_x86-client|$MIPS|$X86"
            "x86-server_ppc-client|$X86|$PPC"
            "ppc-server_x86-client|$PPC|$X86"
            "x86-server_rv64-client|$X86|$RV64"
            "rv64-server_x86-client|$RV64|$X86"
          )

          CONFIGS=(
            "--disable-fec|no-fec"
            "--disable-fec --key testkey123|no-fec-key"
            "--fec 20:10|fec-20-10"
            "--fec 20:10 --key testkey123|fec-20-10-key"
          )

          for entry in "${TESTS[@]}"; do
            IFS='|' read -r pair_name server_cmd client_cmd <<< "$entry"
            for cfg in "${CONFIGS[@]}"; do
              IFS='|' read -r cfg_args cfg_label <<< "$cfg"
              label="${pair_name}/${cfg_label}"

              echo ""
              echo "=========================================="
              echo "  TESTING: $label"
              echo "=========================================="

              if bash bench/interop.sh \
                --server-cmd "$server_cmd" \
                --client-cmd "$client_cmd" \
                $cfg_args \
                --label "$label" \
                --packets 200; then
                PASS=$((PASS + 1))
              else
                FAIL=$((FAIL + 1))
                echo "^^^ FAILED: $label ^^^"
              fi
            done
          done

          echo ""
          echo "=========================================="
          echo "  INTEROP RESULTS: $PASS passed, $FAIL failed"
          echo "=========================================="

          if [[ $FAIL -ne 0 ]]; then
            exit 1
          fi
