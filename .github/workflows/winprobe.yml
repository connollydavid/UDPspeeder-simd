name: windows qwave probe

# Experiment three: why does AddSocketToFlow answer ERROR_NOT_SUPPORTED
# on the hosted runner even with the service running and ms_pacer bound?
# The remaining suspects: a disabled dependency of QWAVE (its admission
# machinery half-alive), or a reason named in the QoS event log.

on:
  workflow_dispatch:
  push:
    branches: [ci-winprobe2]

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: QWAVE service configuration and dependencies
        shell: powershell
        run: |
          sc.exe qc QWAVE
          Write-Output "=== dependency states"
          $cfg = (sc.exe qc QWAVE | Select-String 'DEPENDENCIES') -replace '.*:\s*',''
          $cfg
          foreach ($n in ($cfg -split '/')) {
            $n = $n.Trim()
            if ($n) {
              Get-Service $n -ErrorAction SilentlyContinue | Format-Table Name, Status, StartType
              $cs = Get-CimInstance Win32_Service -Filter "Name='$n'" -ErrorAction SilentlyContinue
              if ($cs -and $cs.StartMode -eq 'Disabled') {
                Write-Output "enabling and starting $n"
                Set-Service $n -StartupType Manual
                Start-Service $n -ErrorAction Continue
              }
            }
          }
          Write-Output "=== pacer driver"
          Get-CimInstance Win32_SystemDriver -Filter "Name='qospaced'" -ErrorAction SilentlyContinue | Format-List Name, State, StartMode, PathName
          Get-CimInstance Win32_SystemDriver -Filter "Name='pacer'" -ErrorAction SilentlyContinue | Format-List Name, State, StartMode, PathName
          Start-Service QWAVE -ErrorAction Continue
          Get-Service QWAVE | Format-Table Name, Status

      - name: The QoS operational log, before
        shell: powershell
        run: |
          Get-WinEvent -ListLog *QoS*,*qWAVE* -ErrorAction SilentlyContinue | Format-Table LogName, RecordCount
          Get-WinEvent -LogName 'Microsoft-Windows-QoS/Operational' -MaxEvents 20 -ErrorAction SilentlyContinue |
            Format-Table TimeCreated, Id, LevelDisplayName, Message -Wrap

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Ask for flows
        shell: msys2 {0}
        run: |
          set -e
          cat > /tmp/probe.c <<'EOF'
          #include <winsock2.h>
          #include <ws2tcpip.h>
          #include <stdio.h>
          #ifndef _WIN32_WINNT
          #define _WIN32_WINNT 0x0600
          #endif
          typedef struct { unsigned short MajorVersion, MinorVersion; } qwave_version_t;
          typedef unsigned int qwave_flow_id_t;
          extern WINBOOL WINAPI QOSCreateHandle(const qwave_version_t *, HANDLE *);
          extern WINBOOL WINAPI QOSAddSocketToFlow(HANDLE, SOCKET, const void *, int, unsigned long, qwave_flow_id_t *);
          extern WINBOOL WINAPI QOSSetFlow(HANDLE, qwave_flow_id_t, int, unsigned long, void *, unsigned long, void *);
          int main(void) {
              WSADATA w;
              HANDLE h = INVALID_HANDLE_VALUE;
              const qwave_version_t v = { 1, 0 };
              qwave_flow_id_t flow = 0;
              struct sockaddr_in dest;
              DWORD value = 46;
              SOCKET s;
              if (WSAStartup(MAKEWORD(2,2), &w) != 0) { printf("WSAStartup failed\n"); return 1; }
              if (!QOSCreateHandle(&v, &h)) { printf("handle FAILED gle=%lu\n", (unsigned long)GetLastError()); return 1; }
              printf("handle ok\n");
              s = socket(AF_INET, SOCK_DGRAM, 0);
              memset(&dest, 0, sizeof(dest));
              dest.sin_family = AF_INET; dest.sin_port = htons(53);
              dest.sin_addr.s_addr = inet_addr("8.8.8.8");
              if (!QOSAddSocketToFlow(h, s, &dest, 0, 0, &flow)) { printf("addflow FAILED gle=%lu\n", (unsigned long)GetLastError()); return 2; }
              printf("addflow ok flow=%u\n", flow);
              if (!QOSSetFlow(h, flow, 2, sizeof(value), &value, 0, 0)) { printf("setdscp FAILED gle=%lu\n", (unsigned long)GetLastError()); return 3; }
              printf("setdscp ok\nPROBE SUCCESS\n");
              return 0;
          }
          EOF
          gcc -o /tmp/probe.exe /tmp/probe.c -lws2_32 -lqwave
          /tmp/probe.exe || true

      - name: The QoS operational log, after
        shell: powershell
        run: |
          Get-WinEvent -LogName 'Microsoft-Windows-QoS/Operational' -MaxEvents 20 -ErrorAction SilentlyContinue |
            Format-Table TimeCreated, Id, LevelDisplayName, Message -Wrap

  exe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the mingw cross
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build the exe
        run: make mingw_cross cc_mingw_cross=x86_64-w64-mingw32-g++-posix
      - uses: actions/upload-artifact@v4
        with:
          name: udpspeeder-simd-windows
          path: speederv2.exe
