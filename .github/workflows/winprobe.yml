name: windows qwave probe

# Experiment four: the working reference (a verified Cygwin qWAVE patch)
# differs from our failing call in three ways -- it passes
# QOS_NON_ADAPTIVE_FLOW (skipping the estimation machinery whose refusal
# we hit), a NULL destination (whole-socket flow), and it runs elevated.
# This probe runs the full matrix and names which cell works.

on:
  workflow_dispatch:
  push:
    branches: [ci-winprobe2]

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Start the qWAVE service, honestly
        shell: powershell
        run: |
          try { Start-Service QWAVE -ErrorAction Stop; "service started" }
          catch { "service start: $($_.Exception.Message)" }
          Get-Service QWAVE | Format-Table Name, Status
          whoami /groups | Select-String 'S-1-5-32-544|High|High Mandatory' | ForEach-Object { "elevation token: $_" }

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Write the matrix probe
        shell: msys2 {0}
        run: |
          set -e
          cat > /tmp/probe.c <<'EOF'
          #include <winsock2.h>
          #include <ws2tcpip.h>
          #include <stdio.h>
          #ifndef _WIN32_WINNT
          #define _WIN32_WINNT 0x0600
          #endif
          typedef struct { unsigned short MajorVersion, MinorVersion; } qwave_version_t;
          typedef unsigned int qwave_flow_id_t;
          extern WINBOOL WINAPI QOSCreateHandle(const qwave_version_t *, HANDLE *);
          extern WINBOOL WINAPI QOSAddSocketToFlow(HANDLE, SOCKET, const void *, int, unsigned long, qwave_flow_id_t *);
          extern WINBOOL WINAPI QOSSetFlow(HANDLE, qwave_flow_id_t, int, unsigned long, void *, unsigned long, void *);
          static int cell(HANDLE h, const char *label, const void *dest, unsigned long flags) {
              qwave_flow_id_t flow = 0;
              DWORD value = 46;
              SOCKET s = socket(AF_INET, SOCK_DGRAM, 0);
              printf("%-28s ", label);
              fflush(stdout);
              if (!QOSAddSocketToFlow(h, s, dest, 0, flags, &flow)) {
                  printf("addflow FAILED gle=%lu\n", (unsigned long)GetLastError());
                  return 1;
              }
              if (!QOSSetFlow(h, flow, 2, sizeof(value), &value, 0, 0)) {
                  printf("setdscp FAILED gle=%lu\n", (unsigned long)GetLastError());
                  return 2;
              }
              printf("OK flow=%u\n", flow);
              return 0;
          }
          int main(void) {
              WSADATA w;
              HANDLE h = INVALID_HANDLE_VALUE;
              const qwave_version_t v = { 1, 0 };
              struct sockaddr_in dest;
              int rc = 0;
              if (WSAStartup(MAKEWORD(2,2), &w) != 0) { printf("WSAStartup failed\n"); return 1; }
              if (!QOSCreateHandle(&v, &h)) { printf("handle FAILED gle=%lu\n", (unsigned long)GetLastError()); return 1; }
              printf("handle ok\n");
              memset(&dest, 0, sizeof(dest));
              dest.sin_family = AF_INET; dest.sin_port = htons(53);
              dest.sin_addr.s_addr = inet_addr("8.8.8.8");
              rc |= cell(h, "adaptive+routable:", &dest, 0);
              rc |= cell(h, "nonadaptive+routable:", &dest, 2 /* QOS_NON_ADAPTIVE_FLOW */);
              printf(rc == 0 ? "MATRIX ALL OK\n" : "MATRIX PARTIAL rc=%d\n", rc);
              return 0;
          }
          EOF
          gcc -o /tmp/probe.exe /tmp/probe.c -lws2_32 -lqwave

      - name: Run the matrix, plain
        shell: msys2 {0}
        run: |
          echo "=== plain (runner shell)"
          /tmp/probe.exe || true

      - name: Run the matrix, elevated
        shell: powershell
        run: |
          Write-Output "=== elevated (scheduled task, highest run level)"
          $msys = Join-Path $env:RUNNER_TEMP "msys64"
          $action = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c $msys\tmp\probe.exe > $msys\tmp\elevated.txt 2>&1"
          Register-ScheduledTask -TaskName qwavetest -Action $action -RunLevel Highest -User $env:USERNAME -Force | Out-Null
          Start-ScheduledTask -TaskName qwavetest
          Start-Sleep -Seconds 12
          Get-Content (Join-Path $env:RUNNER_TEMP "msys64\tmp\elevated.txt") -ErrorAction SilentlyContinue | Write-Output
          Unregister-ScheduledTask -TaskName qwavetest -Confirm:$false -ErrorAction SilentlyContinue

  exe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the mingw cross
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build the exe
        run: make mingw_cross cc_mingw_cross=x86_64-w64-mingw32-g++-posix
      - uses: actions/upload-artifact@v4
        with:
          name: udpspeeder-simd-windows
          path: udpspeeder-simd.exe
