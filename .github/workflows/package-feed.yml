name: package feed

# Signed package repositories for udpspeeder-simd, served from GitHub Pages.
#
# Only udpspeeder-simd is published. The stock udpspeeder is OpenWrt's own
# package and installable from the official feed already, so shipping our build
# of it beside theirs would add a second answer to a question that has one.
#
# Two release lines, and they do not share a format. 25.12 uses apk, whose index
# is one signed file built by `apk mkndx` with an EC key. 24.10 uses opkg, whose
# index is a Packages file signed detached by usign with a different key. So the
# publish step branches and there are two secrets.
#
# Laid out by release rather than by format, because a later release will also
# be apk while carrying a different ABI, and one directory cannot serve both.
#
# This exists because udpspeeder-simd is in no feed until openwrt/packages
# #29901 merges. Once it does, the official feed is the better answer and this
# should be retired rather than left running beside it.

# Dispatch only until a run has published successfully. The feed branches carry
# v1.0.3 and the signing secrets are set, but nothing has exercised the path end
# to end, and a scheduled first run would sign and publish unattended. Restore
# the weekly line once a dispatched run has produced a feed worth serving.
#   schedule:
#     - cron: "0 8 * * 1"
on:
  workflow_dispatch:

permissions:
  contents: write

# Against itself only, so a manual dispatch cannot overlap the scheduled run and
# publish two indexes at once. ci.yml also commits to gh-pages (benchmark data),
# and the two are not serialised: sharing a group would queue every push behind a
# full feed build, which costs more than the rare collision it would prevent.
concurrency:
  group: package-feed
  cancel-in-progress: false

env:
  PKG_REPO: https://github.com/connollydavid/packages.git

jobs:
  matrix:
    name: Read the architecture map
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.read.outputs.arches }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          # 25.12 serves apk, 24.10 serves opkg. The format follows the release,
          # so it is carried here rather than worked out again downstream.
          json=$(awk -F'\t' '
          /^#/ || NF < 4 { next }
          {
            printf "%s{\"arch\":\"%s\",\"target\":\"%s\",\"release\":\"25.12\",\"fmt\":\"apk\"}", sep, $1, $2; sep=","
            printf "%s{\"arch\":\"%s\",\"target\":\"%s\",\"release\":\"24.10\",\"fmt\":\"opkg\"}", sep, $1, $2
          }' .github/scripts/openwrt-arch-map.tsv)
          echo "arches={\"include\":[$json]}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.arch }} ${{ matrix.release }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.arches) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Fetch the package
        run: |
          # One branch per release line, so a release can carry its own recipe.
          # Neither is offered upstream; the pull request has its own branch.
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "feed-${{ matrix.release }}" "$PKG_REPO" feed
          git -C feed sparse-checkout set net/udpspeeder-simd
          mkdir -p localfeed/net
          cp -r feed/net/udpspeeder-simd localfeed/net/

      # Resolved before the cache so the key names the exact tarball. A target
      # absent from a release line is reported by name: airoha/an7581 exists
      # only on main, and its bare wget failure read as a network fault.
      - name: Resolve the ${{ matrix.release }} SDK for ${{ matrix.target }}
        id: sdk
        run: |
          idx="https://downloads.openwrt.org/releases"
          ver=$(wget -qO- "$idx/" \
            | grep -oE "\"${{ matrix.release }}\.[0-9]+(-rc[0-9]+)?/\"" \
            | tr -d '"/' | sort -V | tail -1)
          if [ -z "$ver" ]; then echo "FAIL  no ${{ matrix.release }} release found"; exit 1; fi
          base="$idx/$ver/targets/${{ matrix.target }}"
          if ! wget -qO sha256sums "$base/sha256sums"; then
            echo "FAIL  ${{ matrix.target }} has no SDK in ${{ matrix.release }} ($base)"
            echo "      Point this architecture at a target the release line carries."
            exit 1
          fi
          sdk=$(grep -oE 'openwrt-sdk[^*]+\.tar\.zst' sha256sums | head -1)
          if [ -z "$sdk" ]; then echo "FAIL  no SDK listed for ${{ matrix.target }} in $ver"; exit 1; fi
          echo "ver=$ver"   >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "sdk=$sdk"   >> "$GITHUB_OUTPUT"

      # Not cached, deliberately. These SDKs average 240 MB and the matrix has 70
      # of them, about 16 GB against a 10 GB per-repository cache. Caching them
      # would never hold and would evict every other cache in the repo on the
      # way. The one SDK the index job reuses every run is cached, in that job.
      - name: Fetch and verify the SDK
        run: |
          wget -qO sdk.tar.zst "${{ steps.sdk.outputs.base }}/${{ steps.sdk.outputs.sdk }}"
          # sha256sums was fetched to name the file; it also states the hash, so
          # check it rather than trust the transfer.
          want=$(grep " \*\?${{ steps.sdk.outputs.sdk }}\$" sha256sums | awk '{print $1}')
          got=$(sha256sum sdk.tar.zst | awk '{print $1}')
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "FAIL  SDK checksum mismatch for ${{ steps.sdk.outputs.sdk }}"
            echo "      recorded $want"
            echo "      got      $got"
            exit 1
          fi
          echo "ok      sha256 $got"
          mkdir sdk && tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Build
        run: |
          cd sdk
          echo "src-link localfeed $GITHUB_WORKSPACE/localfeed" > feeds.conf
          ./scripts/feeds update localfeed
          ./scripts/feeds install -a -p localfeed
          make defconfig
          echo CONFIG_PACKAGE_udpspeeder-simd=m >> .config
          make defconfig
          make package/feeds/localfeed/udpspeeder-simd/compile -j"$(nproc)"

      - name: Collect
        run: |
          mkdir -p out
          find sdk/bin \( -name 'udpspeeder-simd*.apk' -o -name 'udpspeeder-simd*.ipk' \) \
            -exec cp {} out/ \;
          if [ -z "$(ls -A out)" ]; then
            echo "FAIL  the build produced no package for ${{ matrix.arch }} ${{ matrix.release }}"
            exit 1
          fi
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.release }}-${{ matrix.arch }}
          path: out/

  index:
    name: Sign the indexes and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: pkg-*

      # Two keys, because the two formats sign differently and neither tool
      # reads the other's. apk mkndx takes an EC prime256v1 key; usign takes its
      # own keypair. Every half stays in a secret and reaches the job through
      # env rather than a command line. The public halves are published beside
      # the indexes, since a client cannot verify either feed without them.
      - name: Take the signing keys
        env:
          APK_KEY: ${{ secrets.APK_SIGNING_KEY }}
          OPKG_KEY: ${{ secrets.OPKG_SIGNING_KEY }}
          OPKG_PUB: ${{ secrets.OPKG_PUBLIC_KEY }}
        run: |
          missing=0
          if [ -z "$APK_KEY" ]; then
            echo "FAIL  APK_SIGNING_KEY unset; 25.12 cannot be signed"
            echo "        openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem"
            missing=1
          fi
          if [ -z "$OPKG_KEY" ]; then
            echo "FAIL  OPKG_SIGNING_KEY unset; 24.10 cannot be signed"
            echo "        usign -G -s key-build -p key-build.pub"
            echo "        (set the secret to the contents of key-build)"
            missing=1
          fi
          # usign cannot derive a public key from a secret one, so the public
          # half is supplied rather than reconstructed. It is held as a secret
          # like the other two, no key material in the tree, either half.
          # Nothing here prints it, since GitHub would mask it anyway; the
          # fingerprint below is derived, so it stays readable.
          if [ -z "$OPKG_PUB" ]; then
            echo "FAIL  OPKG_PUBLIC_KEY unset; 24.10 clients could not verify the feed"
            echo "        (set it to the contents of key-build.pub)"
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          printf '%s' "$APK_KEY"  > private-key.pem; chmod 600 private-key.pem
          printf '%s' "$OPKG_KEY" > key-build;       chmod 600 key-build
          printf '%s' "$OPKG_PUB" > key-build.pub

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y wget zstd

      - name: Resolve the SDK carrying the host tools
        id: hostsdk
        run: |
          idx="https://downloads.openwrt.org/releases"
          ver=$(wget -qO- "$idx/" | grep -oE '"25\.12\.[0-9]+(-rc[0-9]+)?/"' \
            | tr -d '"/' | sort -V | tail -1)
          if [ -z "$ver" ]; then echo "FAIL  no 25.12 release found"; exit 1; fi
          base="$idx/$ver/targets/x86/64"
          if ! wget -qO sha256sums "$base/sha256sums"; then
            echo "FAIL  no SDK index at $base"; exit 1
          fi
          sdk=$(grep -oE 'openwrt-sdk[^*]+\.tar\.zst' sha256sums | head -1)
          if [ -z "$sdk" ]; then echo "FAIL  no SDK listed in $ver"; exit 1; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "sdk=$sdk"   >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: sdk.tar.zst
          key: sdk-hosttools-${{ steps.hostsdk.outputs.sdk }}

      # apk, usign and ipkg-make-index.sh all ship inside the SDK: the tarball
      # carries staging_dir/host/bin prebuilt and scripts/ whole. It carries no
      # package/system tree, so the compile this step used to run had no target
      # to build, and the job had never run for anyone to notice.
      - name: Take the host tools from the SDK
        run: |
          if [ ! -f sdk.tar.zst ]; then
            wget -qO sdk.tar.zst "${{ steps.hostsdk.outputs.base }}/${{ steps.hostsdk.outputs.sdk }}"
          else
            echo "cached  ${{ steps.hostsdk.outputs.sdk }}"
          fi
          want=$(grep " \*\?${{ steps.hostsdk.outputs.sdk }}\$" sha256sums | awk '{print $1}')
          got=$(sha256sum sdk.tar.zst | awk '{print $1}')
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "FAIL  SDK checksum mismatch"
            echo "      recorded $want"
            echo "      got      $got"
            exit 1
          fi
          mkdir sdk && tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          for t in apk usign mkhash; do
            [ -x "sdk/staging_dir/host/bin/$t" ] || { echo "FAIL  the SDK has no $t"; exit 1; }
          done
          [ -x sdk/scripts/ipkg-make-index.sh ] || { echo "FAIL  the SDK has no ipkg-make-index.sh"; exit 1; }
          echo "APK=$PWD/sdk/staging_dir/host/bin/apk"     >> "$GITHUB_ENV"
          echo "USIGN=$PWD/sdk/staging_dir/host/bin/usign" >> "$GITHUB_ENV"
          echo "MKINDEX=$PWD/sdk/scripts/ipkg-make-index.sh" >> "$GITHUB_ENV"
          # ipkg-make-index.sh calls $MKHASH for each package sha and OpenWrt's
          # build system is what normally sets it. Unset it expands to nothing,
          # the script runs `sha256` and dies at 127.
          echo "MKHASH=$PWD/sdk/staging_dir/host/bin/mkhash" >> "$GITHUB_ENV"

      # One index per architecture per release: a client asks for its own and
      # will not read another's.
      - name: Build and sign every index
        run: |
          set -euo pipefail
          [ -x "$APK" ]   || { echo "FAIL  no apk host tool";   exit 1; }
          [ -x "$USIGN" ] || { echo "FAIL  no usign host tool"; exit 1; }
          mkdir -p site
          openssl ec -in private-key.pem -pubout -out site/apk-public-key.pem
          # The two usign halves arrive as separate secrets and nothing so far
          # has established they are one pair. A mismatch would sign with one
          # key and publish the other's public half, so every client would
          # reject a feed that otherwise looks well-formed. Sign a scratch file
          # and verify it to prove the pair before anything is published.
          echo pair-check > pairtest
          "$USIGN" -S -m pairtest -s key-build
          if ! "$USIGN" -V -q -m pairtest -p key-build.pub; then
            echo "FAIL  OPKG_PUBLIC_KEY is not the public half of OPKG_SIGNING_KEY"
            echo "      Regenerate both from one usign -G run and reset them."
            exit 1
          fi
          rm -f pairtest pairtest.sig
          echo "ok    usign keypair matches"
          # -F fingerprints either half, so the id could come from the secret
          # key just as well. It is taken from the public one because that is
          # the file published below, and the two must agree. The fingerprint
          # is derived rather than secret, so it is not masked and can be
          # checked against what a client has installed.
          "$USIGN" -F -p key-build.pub > keyid.txt
          echo "usign key fingerprint: $(cat keyid.txt)"
          cp key-build.pub "site/usign-$(cat keyid.txt).pub"
          for d in collected/pkg-*; do
            rest=${d#collected/pkg-}; rel=${rest%%-*}; arch=${rest#*-}
            dst="site/$rel/$arch"; mkdir -p "$dst"; cp "$d"/* "$dst"/
            if [ "$rel" = "25.12" ]; then
              # --allow-untrusted as OpenWrt's own mkndx calls do: the packages
              # being indexed are unsigned SDK output, and without it mkndx
              # refuses to index them. The index itself is signed, which is what
              # a client checks.
              (cd "$dst" && "$APK" mkndx \
                 --allow-untrusted \
                 --sign "$GITHUB_WORKSPACE/private-key.pem" \
                 --output packages.adb *.apk)
            else
              (cd "$dst" \
                 && "$MKINDEX" . > Packages.manifest \
                 && grep -vE '^(Maintainer|LicenseFiles|Source|SourceName|Require|SourceDateEpoch)' \
                      Packages.manifest > Packages \
                 && rm -f Packages.manifest \
                 && case "$(((64 + $(stat -L -c%s Packages)) % 128))" in \
                      110|111) echo "  padding Packages around the usign SHA-512 bug"; \
                               { echo ""; echo ""; } >> Packages ;; \
                    esac \
                 && gzip -9nc Packages > Packages.gz \
                 && "$USIGN" -S -m Packages \
                      -s "$GITHUB_WORKSPACE/key-build")
            fi
            # The index is what is actually published, so confirm it landed
            # rather than infer it from an exit code. mkndx refuses untrusted
            # input by writing nothing, and it is the file a client fetches.
            if [ "$rel" = "25.12" ]; then
              [ -s "$dst/packages.adb" ] \
                || { echo "FAIL  $rel/$arch has no packages.adb"; exit 1; }
            else
              for f in Packages Packages.gz Packages.sig; do
                [ -s "$dst/$f" ] || { echo "FAIL  $rel/$arch has no $f"; exit 1; }
              done
            fi
            echo "ok    $rel/$arch: $(ls "$dst" | grep -cE '\.(apk|ipk)$') package(s)"
          done
          rm -f private-key.pem key-build key-build.pub

      - name: Write the landing page
        run: |
          keyid=$(cat keyid.txt)
          cat > site/index.html <<HTML
          <!doctype html><meta charset=utf-8>
          <title>udpspeeder-simd — an unofficial package feed</title>
          <style>body{font-family:ui-monospace,Menlo,monospace;max-width:46rem;
          margin:4rem auto;padding:0 1.25rem;line-height:1.6}
          pre{background:#8881;padding:1rem;overflow-x:auto}
          .unofficial{border-left:3px solid currentColor;padding-left:1rem}
          @media(prefers-color-scheme:dark){body{background:#111;color:#ddd}
          a{color:#8bf}}</style>
          <h1>udpspeeder-simd</h1>
          <p class=unofficial><strong>A personal feed.</strong> Built and signed
          by David Connolly. Not affiliated with, endorsed by, or supported by
          the OpenWrt project. Report problems at
          <a href="https://github.com/connollydavid/packages/issues">connollydavid/packages</a>.</p>
          <h2>OpenWrt 25.12 (apk)</h2>
          <pre>wget -O /etc/apk/keys/udpspeeder-simd.pem \\
            https://connollydavid.github.io/UDPspeeder-simd/feed/apk-public-key.pem
          echo "https://connollydavid.github.io/UDPspeeder-simd/feed/25.12/\$(apk --print-arch)/packages.adb" \\
            >> /etc/apk/repositories.d/customfeeds.list
          apk update &amp;&amp; apk add udpspeeder-simd</pre>
          <h2>OpenWrt 24.10 (opkg)</h2>
          <pre>wget -O /etc/opkg/keys/$keyid \\
            https://connollydavid.github.io/UDPspeeder-simd/feed/usign-$keyid.pub
          . /etc/openwrt_release
          echo "src/gz udpspeeder_simd https://connollydavid.github.io/UDPspeeder-simd/feed/24.10/\$DISTRIB_ARCH" \\
            >> /etc/opkg/customfeeds.conf
          opkg update &amp;&amp; opkg install udpspeeder-simd</pre>
          HTML

      # Pages here is served from the gh-pages branch, and mdbook.yml owns its
      # root. Publishing through the Actions artifact route would switch the
      # Pages source and take the book offline, so this writes into a
      # subdirectory of the same branch and leaves everything else alone.
      - name: Publish under /feed on gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: feed
          keep_files: false
